      <stop offset="0" stop-color="#9ff0e6"/>
      <stop offset="0.55" stop-color="#2fb5ad"/>
      <stop offset="1" stop-color="#0d6f7a"/>
    </radialGradient>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a861"/>
